name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # ubuntu-latest ships an Android SDK (ANDROID_HOME); AGP installs the
      # platform and build tools it needs on first use.
      - name: Unit tests and lint
        run: ./gradlew check
      - name: Publish to Maven local (what JitPack runs)
        run: ./gradlew :smoothmotion-core:publishToMavenLocal :smoothmotion-media3:publishToMavenLocal :smoothmotion-ui:publishToMavenLocal
      - name: Shaders compile as GLSL ES 3.10
        run: |
          sudo apt-get install -y -qq glslang-tools
          python3 tools/validate_shaders.py
